<title>2-10A xona Oʻzbek tili</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: header (room badge, title, UZ/RU/EN), five tabs, one panel per wall in room 2-10A.
   Green = grammar and alphabet plaques, blue = UN and mother-tongue plaques, amber = the literature wall. */
:root{
  --bg:#f2f6f1; --surface:#ffffff; --ink:#14261a; --muted:#55675b; --line:#d4dfd5;
  --g:#1f9d3d; --g-ink:#136b29; --g-tint:#e3f4e8;
  --b:#1b75d0; --b-ink:#1559a6; --b-tint:#e4effc;
  --a:#e9a321; --a-ink:#8a5a00; --a-tint:#fdf1d6;
  --red:#c0262d;
  --accent:var(--g); --accent-ink:var(--g-ink); --accent-tint:var(--g-tint); --on-accent:#ffffff;
  --font-display:'Oswald','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --font-body:'Fira Sans','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1710; --surface:#16231a; --ink:#e8f1ea; --muted:#9db0a2; --line:#27392c;
    --g-ink:#6fd88a; --g-tint:#12301c;
    --b-ink:#79b6ff; --b-tint:#13284a;
    --a-ink:#f3c363; --a-tint:#3a2c0e;
    --red:#ff7a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1710; --surface:#16231a; --ink:#e8f1ea; --muted:#9db0a2; --line:#27392c;
  --g-ink:#6fd88a; --g-tint:#12301c;
  --b-ink:#79b6ff; --b-tint:#13284a;
  --a-ink:#f3c363; --a-tint:#3a2c0e;
  --red:#ff7a80; color-scheme:dark;
}
:root[data-tab="turkumlar"], :root[data-tab="alifbo"]{--accent:var(--g); --accent-ink:var(--g-ink); --accent-tint:var(--g-tint); --on-accent:#ffffff}
:root[data-tab="bmt"], :root[data-tab="ona"]{--accent:var(--b); --accent-ink:var(--b-ink); --accent-tint:var(--b-tint); --on-accent:#ffffff}
:root[data-tab="adabiyot"]{--accent:var(--a); --accent-ink:var(--a-ink); --accent-tint:var(--a-tint); --on-accent:#2e1d00}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.45;
  padding-block:24px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1100px; margin:0 auto}

.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px; margin-bottom:20px}
.brand{min-width:0}
.badge{margin:0 0 14px; font-size:13px; font-weight:700; letter-spacing:.06em}
.badge b{display:inline-block; margin-right:8px; padding:3px 9px; border-radius:6px; background:var(--accent); color:var(--on-accent); letter-spacing:.04em}
.eyebrow{margin:0 0 6px; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{
  margin:0; font-family:var(--font-display); font-weight:600; text-transform:uppercase;
  font-size:clamp(34px, 7vw, 60px); line-height:1.02; letter-spacing:.015em; text-wrap:balance;
}
h1::after{content:""; display:block; width:72px; height:7px; margin-top:12px; background:var(--accent)}

.lang{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.lang button{
  font:inherit; font-weight:600; font-size:14px; letter-spacing:.06em; min-width:56px; min-height:44px;
  padding:0 14px; border:0; background:transparent; color:var(--ink); cursor:pointer;
}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:-3px}

.banner{margin:0 0 24px; max-width:860px}
.banner img{display:block; width:100%; height:auto; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
.banner figcaption{margin:8px 2px 0; font-size:14px; color:var(--muted); line-height:1.4}
.banner figcaption b{color:var(--ink); font-weight:600}

.tabs{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 28px; border-bottom:1px solid var(--line)}
.tab{
  flex:none; min-height:48px; padding:0 18px; margin-bottom:-1px; cursor:pointer;
  font-family:var(--font-display); font-weight:500; font-size:19px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); background:transparent; border:0; border-bottom:4px solid transparent;
}
.tab[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--accent)}
@media (max-width:640px){ .tab{padding:0 10px; font-size:15px; letter-spacing:.02em} .tabs{gap:2px} }

.lead{margin:0 0 20px; max-width:62ch; color:var(--muted); font-size:15px}
h2{margin:0 0 6px; font-family:var(--font-display); font-weight:600; font-size:clamp(24px,4vw,34px); letter-spacing:.03em; text-transform:uppercase; text-wrap:balance}

/* parts of speech */
.thead, .trow{display:grid; grid-template-columns:190px minmax(0,1fr) minmax(0,1fr); gap:0 16px}
.thead{padding:0 0 8px; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.rows{display:grid; gap:10px}
.trow{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; align-items:stretch}
.term{padding:14px 16px; background:var(--accent); color:var(--on-accent); display:flex; flex-direction:column; justify-content:center; gap:2px}
.term b{font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:.06em; text-transform:uppercase; line-height:1.1}
.term span{font-size:14px; font-weight:500; opacity:.92}
.cell{padding:14px 16px; min-width:0}
.cell .lab{display:none; margin-bottom:4px; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px 8px}
.chip{padding:3px 10px; border-radius:99px; background:var(--accent-tint); color:var(--accent-ink); font-weight:600; font-size:15px; white-space:nowrap}
@media (max-width:760px){
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr)}
  .cell .lab{display:block}
  .cell+.cell{padding-top:0}
  .term{flex-direction:row; align-items:baseline; justify-content:flex-start; gap:12px}
}

/* alphabet */
.alpha{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(10,auto); grid-auto-flow:column; gap:8px; max-width:560px}
.letter{
  display:grid; place-items:center; min-height:64px; padding:6px 8px; text-align:center;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  font-weight:700; font-size:clamp(24px,5.5vw,34px); line-height:1.1; white-space:nowrap;
}
.letter.v{color:var(--red); border-color:var(--red)}
.legend{margin:16px 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; font-size:15px; color:var(--muted)}
.legend i{display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:-2px; border:2px solid var(--red); border-radius:3px}

/* UN languages */
.langs{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.lc{padding:18px 18px 16px; background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:8px; min-width:0}
.lc .nat{margin:0 0 8px; font-size:28px; font-weight:600; line-height:1.2}
.lc .nm{margin:0; font-family:var(--font-display); font-weight:500; font-size:20px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink)}
.lc .sub{margin:2px 0 0; font-size:14px; color:var(--muted)}

/* mother tongue */
.stack{display:grid; gap:16px; max-width:820px}
.quote{margin:0; padding:24px 24px 20px; background:var(--surface); border:1px solid var(--line); border-left:8px solid var(--accent); border-radius:8px}
.quote p{margin:0; font-size:clamp(19px,3.4vw,25px); font-weight:500; line-height:1.4; text-wrap:balance}
.quote footer{margin:14px 0 0; padding:0; border:0; max-width:none; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink)}
.poem{padding:28px 24px; border-radius:8px; background:var(--b); color:#fff; text-align:center}
.poem h3{margin:0; font-family:var(--font-body); font-weight:700; font-size:clamp(24px,5vw,38px); line-height:1.15; text-wrap:balance}
.poem p{margin:14px auto 0; max-width:48ch; font-size:16px; opacity:.95}

/* literature */
.pills{display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 16px}
.pill{min-height:44px; padding:0 16px; font:inherit; font-weight:600; font-size:15px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:99px; cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.pill small{margin-left:6px; font-size:13px; font-weight:500; opacity:.8}
.worksbox{padding:6px 20px 10px; background:var(--surface); border:1px solid var(--line); border-top:6px solid var(--a); border-radius:8px}
.works{margin:0; padding:0; list-style:none; columns:300px; column-gap:32px}
.works li{break-inside:avoid}
.work{display:flex; gap:12px; align-items:flex-start; width:100%; margin:0; padding:10px 8px; font:inherit; color:inherit; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); cursor:pointer}
.work:hover{background:var(--accent-tint)}
.work:focus-visible{outline-offset:-3px}
.work::after{content:"›"; margin-left:auto; align-self:center; color:var(--muted); font-size:24px; line-height:1}
.work .n{flex:none; display:grid; place-items:center; min-width:36px; height:28px; padding:0 6px; border:2px solid var(--a); border-radius:99px; font-family:var(--font-display); font-weight:500; font-size:15px; color:var(--a-ink); font-variant-numeric:tabular-nums}
.work div{min-width:0}
.work b{display:block; font-weight:600; line-height:1.3; overflow-wrap:anywhere}
.work i{display:block; font-style:normal; font-size:14px; color:var(--muted)}

/* work details sheet */
.modal{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(8,16,10,.6);
  padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{position:relative; width:100%; max-width:480px; max-height:100%; overflow:auto; padding:24px 22px 20px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-top:6px solid var(--accent); border-radius:10px}
.sheet .x{position:absolute; top:8px; right:8px; width:44px; height:44px; font:inherit; font-size:28px; line-height:1; color:var(--muted); background:transparent; border:0; cursor:pointer}
.mk{margin:0 40px 8px 0; font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}
.sheet h3{margin:0; font-size:clamp(24px,6vw,30px); font-weight:700; line-height:1.15; text-wrap:balance}
.ma{margin:6px 0 0; font-size:17px; color:var(--muted)}
.acts{display:grid; gap:10px; margin:20px 0 0}
.btn{display:flex; align-items:center; justify-content:center; min-height:48px; padding:8px 16px; text-align:center; font-weight:600; font-size:16px; text-decoration:none; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px}
.btn:hover{background:var(--accent-tint)}
.btn.main{color:var(--on-accent); background:var(--accent); border-color:var(--accent)}
.btn.main:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.mtext{margin:0; font-size:16px; line-height:1.5}
.mtext.muted{color:var(--muted)}
.acts.tight{margin-top:8px}
.mnote{margin:16px 0 0; font-size:13px; color:var(--muted)}
.sec{margin:18px 0 6px; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.bigl{display:block; font-size:64px; line-height:1.05}
.facts{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 16px; margin:18px 0 0; font-size:16px}
.facts dt{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:2px}
.facts dd{margin:0; overflow-wrap:anywhere}
.ex{display:flex; flex-wrap:wrap; gap:8px}
.exc{padding:5px 11px; border:1px solid var(--line); border-radius:8px; font-size:16px}
.exc b{font-weight:600}
.exc small{font-size:14px; color:var(--muted)}
.sent{margin:16px 0 0; padding:12px 14px; background:var(--accent-tint); border-radius:8px}
.sent b{display:block; font-size:18px; font-weight:600}
.sent span{display:block; margin-top:4px; font-size:14px; color:var(--muted)}
.tap{margin:-10px 0 18px; font-size:14px; font-weight:600; color:var(--accent-ink)}
[data-open]{cursor:pointer}
[data-open]:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.trow[data-open]:hover, .lc[data-open]:hover{border-color:var(--accent)}
.letter{font-family:inherit; color:var(--ink)}
.letter:hover{background:var(--accent-tint)}

[hidden]{display:none !important}
footer.site{max-width:1100px; margin:40px auto 0; padding-top:16px; border-top:1px solid var(--line); font-size:13px; letter-spacing:.06em; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="badge" id="badge"></p>
      <p class="eyebrow" id="eyebrow"></p>

      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  function applyHash(){

    'sheriyat:1':['1491–1492','Navoiyning shoirlar haqidagi tazkirasi.','Тазкире Навои о поэтах.','Navoiʼs biographical anthology of poets.'],
    'sheriyat:2':['','Zahiriddin Muhammad Boburning gʻazal, ruboiy va boshqa sheʼrlar devoni.','Диван Захириддина Мухаммада Бабура: газели, рубаи и другие стихи.','Baburʼs divan of ghazals, rubaʻis and other poems.'],
    'sheriyat:13':['1965','Abdulla Oripovning birinchi sheʼrlar toʻplami.','Первый сборник стихов Абдуллы Орипова.','Abdulla Oripovʼs first poetry collection.']
  };
  var AUDIO = {
    'romanlar:0':'https://ziyouz.com/kutubxona/category/214-utkan-kunlar',
    'romanlar:1':'https://ziyouz.com/kutubxona/category/215-mehrobdan-chayon',
    'romanlar:2':'https://ziyouz.com/kutubxona/category/217-kecha-va-kunduz',
    'romanlar:17':'https://ziyouz.com/kutubxona/category/55-tog-ay-murod-otamdan-qolgan-dalalar-roman'
  };
  var lastFocus = null;
  /* authors whose name is shared with a famous namesake: a plain name search finds the wrong person */
  var AUTHQ = {
    'Muhammad Ali': 'https://www.google.com/search?q=' + encodeURIComponent('Muhammad Ali yozuvchi shoir "Ulugʻ saltanat" vikipediya')
  };

  function plain(s){ return s.replace(/[ʻʼ]/g,'').replace(/[^\p{L}\p{N} ]/gu,'').replace(/ +/g,' ').trim(); }

  function openWork(c, i){
    var w = WORKS[c][i], m = MD[lang], cn = CATS.filter(function(x){return x.k===c;})[0][lang];
    var key = c+':'+i, inf = INFO[key], LI2 = {uz:1, ru:2, en:3};
    var lib = 'https://ziyouz.com/index.php?option=com_search&searchword=' + encodeURIComponent(plain(w[0])).replace(/%20/g,'+');
    var web = 'https://www.google.com/search?q=' + encodeURIComponent(w[0]+' '+w[1]+' '+m.kw);
    var wiki = AUTHQ[w[1]] || ('https://uz.wikipedia.org/w/index.php?search=' + encodeURIComponent(w[1]));
    function a(href, cls, label){ return '<a class="btn'+cls+'" href="'+href+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'; }
    var h = '<button type="button" class="x" id="mClose" aria-label="'+m.close+'">×</button>'
      + '<p class="mk">'+cn+' · № '+(i+1)+' / 20</p><h3 id="mTitle">“'+w[0]+'”</h3><p class="ma">'+w[1]+'</p>';
    /* 1. about the book, 2. year, 3. e-book, 4. more */
    h += '<p class="sec">'+m.about+'</p><p class="mtext">' + (inf ? inf[LI2[lang]] : m.noinfo) + '</p>';
    h += '<dl class="facts"><dt>'+m.year+'</dt><dd>' + ((inf && inf[0]) ? inf[0] : '—') + '</dd><dt>'+m.ya+'</dt><dd>'+w[1]+'</dd><dt>'+m.ty+'</dt><dd>'+cn+'</dd></dl>';
    h += '<p class="sec">'+m.ebook+'</p>';
    if(AUDIO[key]) h += '<div class="acts tight">'+a(AUDIO[key],' main',m.audio)+'</div>';
    else h += '<p class="mtext muted">'+m.nobook+'</p>';
    h += '<p class="sec">'+m.more+'</p><div class="acts tight">'+a(lib,'',m.lib)+a(web,'',m.web)+a(wiki,'',m.auth)+'</div><p class="mnote">'+m.note+'</p>';
    $('sheet').innerHTML = h;
    lastFocus = document.activeElement;
    $('modal').hidden = false;
    $('mClose').focus();
  }
  function closeModal(){
    if($('modal').hidden) return;
    $('modal').hidden = true;
    if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
  }

  /* details for the other sections */
  var LI = {uz:0, ru:1, en:2};
  var S2 = {
    uz:{tap:'Batafsil maʼlumot uchun bosing.', kRow:'Soʻz turkumi', kLetter:'Harf', kLang:'BMT tili', kPoem:'Sheʼr lavhasi', q:'Savollar', ex:'Misollar', sent:'Gap', type:'Turi', example:'Misol', script:'Yozuv', greet:'Salomlashish', un:'BMTda', poemWeb:'Sheʼrni internetda qidirish', poemLib:'Ziyouz kutubxonasidan qidirish',
        vowel:'Unli harf (oʻzbek tilida 6 ta unli bor: a, e, i, o, u, oʻ)', cons:'Undosh harf', sign:'Tutuq belgisi. Bu harf emas, belgi.'},
    ru:{tap:'Нажмите на элемент, чтобы узнать подробнее.', kRow:'Часть речи', kLetter:'Буква', kLang:'Язык ООН', kPoem:'Табличка со стихотворением', q:'Вопросы', ex:'Примеры', sent:'Предложение', type:'Тип', example:'Пример', script:'Письмо', greet:'Приветствие', un:'В ООН', poemWeb:'Найти стихотворение в интернете', poemLib:'Искать в библиотеке Ziyouz',
        vowel:'Гласная буква (в узбекском языке 6 гласных: a, e, i, o, u, oʻ)', cons:'Согласная буква', sign:'Знак апострофа. Это не буква, а знак.'},
    en:{tap:'Tap an item for details.', kRow:'Part of speech', kLetter:'Letter', kLang:'UN language', kPoem:'Poem plaque', q:'Questions', ex:'Examples', sent:'Sentence', type:'Type', example:'Example', script:'Script', greet:'Greeting', un:'At the UN', poemWeb:'Find the poem online', poemLib:'Search the Ziyouz library',
        vowel:'Vowel (Uzbek has 6 vowels: a, e, i, o, u, oʻ)', cons:'Consonant', sign:'Apostrophe sign. It is a sign, not a letter.'}
  };

  /* one entry per row of ROWS: example words (uz, ru, en) and a sentence */
  var EXR = [
    {w:[['kitob','книга','book'],['talaba','студент','student'],['sport','спорт','sport'],['quvonch','радость','joy']],
     s:['Talaba kitob oʻqiydi.','Студент читает книгу.','The student reads a book.']},
    {w:[['katta','большой','big'],['yaxshi','хороший','good'],['qizil','красный','red'],['kuchli','сильный','strong']],
     s:['Kuchli sportchi gʻalaba qozondi.','Сильный спортсмен одержал победу.','The strong athlete won.']},
    {w:[['bir','один','one'],['uchta','три (штуки)','three (items)'],['ikkinchi','второй','second'],['yigirma','двадцать','twenty']],
     s:['Jamoada oʻn nafar oʻyinchi bor.','В команде десять игроков.','There are ten players on the team.']},
    {w:[['men','я','I'],['sen','ты','you'],['biz','мы','we'],['bu','этот','this']],
     s:['Biz birga mashq qilamiz.','Мы тренируемся вместе.','We train together.']},
    {w:[['oʻqidi','читал','read'],['yozmoqda','пишет','is writing'],['bormoqchi','хочет пойти','wants to go'],['yugurdi','побежал','ran']],
     s:['Bola maktabga yugurdi.','Ребёнок побежал в школу.','The child ran to school.']},
    {w:[['tez','быстро','quickly'],['bugun','сегодня','today'],['sekin','медленно','slowly'],['uzoqda','далеко','far away']],
     s:['Sportchi tez yugurdi.','Спортсмен быстро побежал.','The athlete ran fast.']}
  ];

  /* one example word per entry of LETTERS, same order */
  var LW = [
    ['anor','гранат','pomegranate'],['bola','ребёнок','child'],['daftar','тетрадь','notebook'],['eshik','дверь','door'],['fil','слон','elephant'],
    ['gul','цветок','flower'],['havo','воздух','air'],['ilm','наука, знание','knowledge'],['jamoa','команда','team'],['kitob','книга','book'],
    ['lola','тюльпан','tulip'],['maktab','школа','school'],['non','хлеб','bread'],['olma','яблоко','apple'],['paxta','хлопок','cotton'],
    ['qalam','ручка, карандаш','pen'],['rasm','рисунок','picture'],['suv','вода','water'],['tosh','камень','stone'],['uy','дом','house'],
    ['vazifa','задание','task'],['xat','письмо','letter'],['yulduz','звезда','star'],['zamin','земля','earth'],['oʻqituvchi','учитель','teacher'],
    ['gʻalaba','победа','victory'],['shamol','ветер','wind'],['choy','чай','tea'],['tong','рассвет','dawn'],['maʼno','смысл','meaning']
  ];

  var WORKING = ['BMT Kotibiyatining ish tillaridan biri (ingliz va fransuz tillari)','Один из рабочих языков Секретариата ООН (английский и французский)','A working language of the UN Secretariat (English and French)'];
  var CHARTER = ['BMT Ustavining teng kuchga ega asl matnlari tillaridan biri','Один из языков равноценных аутентичных текстов Устава ООН','One of the languages of the equally authentic texts of the UN Charter'];
  var UD = [
    {sc:['Arab yozuvi (oʻngdan chapga yoziladi)','Арабское письмо (пишется справа налево)','Arabic script (written right to left)'], hi:'مرحبا', tr:'marhaban',
     un:['BMTning rasmiy tili, 1973-yilda qoʻshilgan','Официальный язык ООН, добавлен в 1973 году','UN official language, added in 1973']},
    {sc:['Lotin yozuvi','Латиница','Latin script'], hi:'Bonjour', un:WORKING},
    {sc:['Lotin yozuvi','Латиница','Latin script'], hi:'Hello', un:WORKING},
    {sc:['Lotin yozuvi','Латиница','Latin script'], hi:'Hola', un:CHARTER},
    {sc:['Kirill yozuvi','Кириллица','Cyrillic script'], hi:'Здравствуйте', un:CHARTER},
    {sc:['Xitoy iyeroglif yozuvi','Китайские иероглифы','Chinese characters'], hi:'你好', tr:'nǐ hǎo', un:CHARTER}
  ];

  function abtn(href, cls, label){ return '<a class="btn'+cls+'" href="'+href+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'; }
  function facts(list){ return '<dl class="facts">'+list.map(function(r){ return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'; }).join('')+'</dl>'; }
  function hint(html){ return html.replace('</p>', '</p><p class="tap">'+S2[lang].tap+'</p>'); }

  function showSheet(kick, titleHtml, sub, body, note){
    var m = MD[lang];
    $('sheet').innerHTML = '<button type="button" class="x" id="mClose" aria-label="'+m.close+'">×</button>'
      + '<p class="mk">'+kick+'</p><h3 id="mTitle">'+titleHtml+'</h3>' + (sub ? '<p class="ma">'+sub+'</p>' : '')
      + body + (note ? '<p class="mnote">'+note+'</p>' : '');
    lastFocus = document.activeElement;
    $('modal').hidden = false;
    $('mClose').focus();
  }

  function openItem(key){
    var p = key.split(':'), type = p[0], i = parseInt(p[1], 10), S = S2[lang], x = LI[lang];
    if(type === 'row'){
      var r = ROWS[i], e = EXR[i];
      var body = '<p class="sec">'+S.q+'</p><div class="chips">'+r.q.map(function(q){ return '<span class="chip">'+q+'</span>'; }).join('')+'</div>'
        + '<p class="sec">'+S.ex+'</p><div class="ex">'+e.w.map(function(w){ return '<span class="exc"><b>'+w[0]+'</b>'+(x ? ' <small>'+w[x]+'</small>' : '')+'</span>'; }).join('')+'</div>'
        + '<div class="sent"><b>'+e.s[0]+'</b>'+(x ? '<span>'+e.s[x]+'</span>' : '')+'</div>';
      showSheet(S.kRow, r.t + (x ? ' · '+r[lang] : ''), r.m[lang], body, '');
    } else if(type === 'letter'){
      var l = LETTERS[i], w = LW[i], sign = (i === 29);
      var kind = sign ? S.sign : (l[1] ? S.vowel : S.cons);
      var kick = sign ? S.sign.split('.')[0] : S.kLetter+' № '+(i+1)+' / 29';
      showSheet(kick, '<span class="bigl">'+l[0]+'</span>', '',
        facts([[S.type, kind], [S.example, '<b>'+w[0]+'</b>'+(x ? ' — '+w[x] : '')]]), '');
    } else if(type === 'lang'){
      var u = UN[i], d = UD[i];
      showSheet(S.kLang, '<span dir="auto">'+u.nat+'</span>', u[lang] + (x ? ' · '+u.uz : ''),
        facts([[S.script, d.sc[x]], [S.greet, '<span dir="auto"><b>'+d.hi+'</b></span>'+(d.tr ? ' ('+d.tr+')' : '')], [S.un, d.un[x]]]), '');
    } else if(type === 'poem'){
      var title = 'Oʻzbek tilim, ona tilim, oʻz tilim';
      var web = 'https://www.google.com/search?q=' + encodeURIComponent(title+' Sayyora Samandarova');
      var lib = 'https://ziyouz.com/index.php?option=com_search&searchword=' + encodeURIComponent(plain(title)).replace(/%20/g,'+');
      showSheet(S.kPoem, '“'+title+'”', 'Sayyora Samandarova',
        '<div class="acts">'+abtn(web,' main',S.poemWeb)+abtn(lib,'',S.poemLib)+'</div>', MD[lang].note);
    }
  }

  var BN = {
    uz:{alt:'Abdurauf Fitrat portreti va uning soʻzlari: «Tilimiz – millatimizning bebaho boyligi.»', cap:''},
    ru:{alt:'Портрет Абдурауфа Фитрата и его слова: «Наш язык — бесценное богатство нашей нации.»', cap:'«Наш язык — бесценное богатство нашей нации.» — <b>Абдурауф Фитрат</b>'},
    en:{alt:'Portrait of Abdurauf Fitrat with his words: "Our language is the priceless wealth of our nation."', cap:'“Our language is the priceless wealth of our nation.” — <b>Abdurauf Fitrat</b>'}
  };

  function render(){
    var t = T[lang];
    document.documentElement.lang = lang === 'uz' ? 'uz-Latn' : lang;
    document.documentElement.setAttribute('data-tab', tab);
    $('badge').innerHTML = '<b>2-10A</b>' + t.badge;
    $('eyebrow').textContent = t.eyebrow;
    $('title').textContent = t.title;
    $('foot').textContent = t.foot;
    $('bannerImg').alt = BN[lang].alt;
    $('bannerCap').innerHTML = BN[lang].cap;
    $('bannerCap').hidden = !BN[lang].cap;
    document.querySelectorAll('.lang button').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    $('tabs').innerHTML = TABS.map(function(k){
      return '<button type="button" class="tab" data-tab="'+k+'" aria-pressed="'+(k===tab)+'">'+t.tabs[k]+'</button>';
    }).join('');
    $('panel').innerHTML = hint(PANELS[tab](t));
  }

  document.querySelector('.lang').addEventListener('click', function(e){
    var b = e.target.closest('button[data-lang]'); if(!b) return;
    lang = b.getAttribute('data-lang');
    closeModal();
    try{ localStorage.setItem('xona210a-lang', lang); }catch(err){}
    render();
  });
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-tab]'); if(!b) return;
    tab = b.getAttribute('data-tab');
    try{ history.replaceState(null, '', '#'+tab); }catch(err){ location.hash = tab; }
    render();
  });
  $('panel').addEventListener('click', function(e){
    var o = e.target.closest('[data-open]');
    if(o){ openItem(o.getAttribute('data-open')); return; }
    var w = e.target.closest('button.work');
    if(w){ openWork(cat, parseInt(w.getAttribute('data-i'), 10)); return; }
    var b = e.target.closest('button[data-cat]'); if(!b) return;
    cat = b.getAttribute('data-cat');
    try{ history.replaceState(null, '', '#adabiyot-'+cat); }catch(err){}
    render();
  });
  $('modal').addEventListener('click', function(e){
    if(e.target === $('modal') || e.target.closest('#mClose')) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeModal(); return; }
    if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.hasAttribute('data-open')){
      e.preventDefault();
      openItem(e.target.getAttribute('data-open'));
    }
  });
  window.addEventListener('hashchange', function(){
    if(applyHash()){ closeModal(); render(); }
  });

  render();
})();
</script>
